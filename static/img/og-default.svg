<!--
  Default Open Graph Image
  =========================
  This is used for social sharing when no specific image is set.
  Recommended: Replace with a PNG version (1200x630px) for best compatibility.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#64ffda" stroke-width="2" opacity="0.3"/>

  <!-- Decorative code brackets -->
  <g fill="none" stroke="#64ffda" stroke-width="3" opacity="0.2">
    <path d="M100 150 L50 315 L100 480"/>
    <path d="M1100 150 L1150 315 L1100 480"/>
  </g>

  <!-- Name -->
  <text x="600" y="250" text-anchor="middle" font-family="sans-serif" font-size="72" font-weight="700" fill="#e2e8f0">
    Rogelio Orona
  </text>

  <!-- Title -->
  <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#64ffda">
    Senior Software Engineer
  </text>

  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="monospace" font-size="24" fill="#94a3b8">
    Full-Stack Developer | Java | Spring Boot | Angular | React
  </text>

  <!-- Decorative line -->
  <line x1="300" y1="450" x2="900" y2="450" stroke="#64ffda" stroke-width="2" opacity="0.4"/>

  <!-- Tech icons placeholder dots -->
  <g fill="#64ffda" opacity="0.4">
    <circle cx="480" cy="520" r="8"/>
    <circle cx="540" cy="520" r="8"/>
    <circle cx="600" cy="520" r="8"/>
    <circle cx="660" cy="520" r="8"/>
    <circle cx="720" cy="520" r="8"/>
  </g>
</svg>
