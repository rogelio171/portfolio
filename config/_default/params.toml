# Blowfish Theme Parameters

# Appearance - Using slate for a professional look
colorScheme = "slate"
defaultAppearance = "dark"
autoSwitchAppearance = true

# Enable search
enableSearch = true

# Site metadata
mainSections = ["blog"]
robots = "index, follow"

# Favicon and branding
# Note: Favicon files are in /static/ directory
# - favicon.svg (main icon)
# - apple-touch-icon.svg (iOS/macOS)
# - site.webmanifest (PWA manifest)
favicon = "favicon.svg"

# Default Open Graph image for social sharing
# Replace /img/og-default.svg with a PNG (1200x630px) for best compatibility
defaultOgImage = "/img/og-default.svg"

# Hero settings
[homepage]
  layout = "custom"
  showRecent = true
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "/blog"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = false

# Header settings  
[header]
  layout = "basic"
  logo = ""
  logoDark = ""
  showTitle = false

# Footer settings
[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = false
  showScrollToTop = true

# Article settings
[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = true
  showAuthor = true
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showAuthorsBadges = false
  showWordCount = false
  showSummary = true
  sharingLinks = ["linkedin", "twitter", "reddit", "pinterest", "facebook", "email"]

# List settings
[list]
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showTableOfContents = false
  showSummary = true
  showCards = true
  groupByYear = true
  cardView = true
  cardViewScreenWidth = false

# Sitemap settings
[sitemap]
  excludedKinds = []

# Taxonomy settings
[taxonomy]
  showTermCount = true
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

# Term settings
[term]
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false

# Author settings
[author]
  name = "Rogelio Orona"
  headline = "Senior Software Engineer"
  bio = "Full-Stack Developer with expertise in Java, Spring Boot, Angular, and React. Building scalable solutions with cloud technologies."
  links = [
    { github = "https://github.com/rogelioorona" },
    { linkedin = "https://linkedin.com/in/rogelioorona" },
    { email = "mailto:rogelio.orona@proton.me" }
  ]

# ============================================
# ANALYTICS CONFIGURATION
# ============================================
# Choose ONE analytics provider: GA4 or Plausible
# Set enabled = true for your preferred provider
#
# PRIVACY NOTE: Both options are configured for privacy-friendly tracking
# ============================================

[analytics]
  # --------------------------------------------
  # Google Analytics 4 (GA4)
  # --------------------------------------------
  # To get your GA4 Measurement ID:
  # 1. Go to https://analytics.google.com
  # 2. Create a property or select existing one
  # 3. Go to Admin > Data Streams > Web
  # 4. Copy the Measurement ID (format: G-XXXXXXXXXX)
  #
  # Privacy settings are enabled by default:
  # - IP anonymization
  # - No advertising features
  # - Respects Do Not Track
  [analytics.ga4]
    enabled = false
    measurementId = ""  # Replace with your GA4 Measurement ID (e.g., "G-XXXXXXXXXX")
    # Privacy-friendly settings
    anonymizeIP = true              # Anonymize visitor IP addresses
    respectDoNotTrack = true        # Honor browser DNT setting
    disableAdFeatures = true        # Disable advertising features
    cookieFlags = "SameSite=Strict" # Strict cookie policy

  # --------------------------------------------
  # Plausible Analytics (Privacy-Focused Alternative)
  # --------------------------------------------
  # To get started with Plausible:
  # 1. Sign up at https://plausible.io (or self-host)
  # 2. Add your domain
  # 3. Use your domain as the dataDomain value
  #
  # Benefits: No cookies, GDPR compliant by default,
  # lightweight script (~1KB), EU-based servers
  [analytics.plausible]
    enabled = false
    dataDomain = ""     # Your site domain (e.g., "rogelioorona.com")
    scriptUrl = "https://plausible.io/js/script.js"  # Default Plausible CDN
    # For self-hosted: use your Plausible instance URL
    # scriptUrl = "https://analytics.yourdomain.com/js/script.js"
    #
    # Optional: Enable additional tracking features
    # Use "https://plausible.io/js/script.outbound-links.js" for external link tracking
    # Use "https://plausible.io/js/script.file-downloads.js" for download tracking
    # Combine features: "https://plausible.io/js/script.outbound-links.file-downloads.js"

